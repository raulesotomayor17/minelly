name: Minelly RVR1909 installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rvr1909-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows-x64-nsis
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run tauri build -- --config src-tauri/tauri.rvr1909.json --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: minelly-rvr1909-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  fedora:
    name: fedora-44-rpm
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 60
    steps:
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y \
            gcc gcc-c++ make cmake pkgconf-pkg-config \
            openssl-devel curl wget file patchelf \
            webkit2gtk4.1-devel gtk3-devel libappindicator-gtk3-devel \
            librsvg2-devel libxdo-devel rpm-build nodejs npm espeak-ng

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build RPM
        run: npm run tauri build -- --config src-tauri/tauri.rvr1909.json --bundles rpm

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: minelly-rvr1909-fedora
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14
